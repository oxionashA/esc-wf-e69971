name: esc-exec-proof
on:
  push:
    branches: [main]
permissions:
  issues: write
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - name: prove attacker code executed with the repository identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "runner=$(hostname) sha=$GITHUB_SHA actor=$GITHUB_ACTOR"
          curl -s -X POST "https://api.github.com/repos/$GITHUB_REPOSITORY/issues" \
            -H "Authorization: token $GH_TOKEN" \
            -d "{\"title\":\"EXEC PROOF $GITHUB_SHA\",\"body\":\"Attacker-authored workflow executed on protected main. actor=$GITHUB_ACTOR\"}" \
            | sed -n 's/.*"number": \([0-9]*\).*/issue=\1/p' | head -1
